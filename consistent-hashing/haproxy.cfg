# Demo 2: conversation affinity across replicas of one model. No module required.
global
    log stdout format raw local0
    nbthread 1

defaults
    mode http
    log global
    option httplog
    timeout connect 1s
    timeout client 10s
    timeout server 10s
    timeout http-request 5s

frontend inference
    bind 127.0.0.1:18081
    http-request return status 404 unless { path -m str /v1/chat/completions }
    http-request return status 405 unless METH_POST
    # Missing keys must not silently fall back to round-robin.
    http-request return status 400 unless { req.hdr_cnt(X-Conversation-ID) eq 1 }
    http-request return status 400 unless { req.hdr(X-Conversation-ID) -m reg [^[:space:]] }
    default_backend gpu_replicas

backend gpu_replicas
    balance hdr(X-Conversation-ID)
    hash-type consistent
    # A refused or timed-out connect is retried on another replica at once instead of
    # returning 503. Two retries: one for each other replica.
    retries 2
    option redispatch 1
    # The default, written out because the comment above depends on it: only requests
    # that never reached a replica are retried, so a POST is never replayed.
    retry-on conn-failure
    option httpchk GET /health
    # The first failed connect marks the replica DOWN without waiting for two failed
    # checks, so the retry already goes to the key's new ring owner: a conversation
    # moves once, not twice. The price: a live replica too slow to accept within
    # "timeout connect" also leaves the ring until its next successful check.
    default-server check inter 500ms fall 2 rise 1 observe layer4 error-limit 1 on-error mark-down
    # Keep IDs and weights stable when comparing the hash ring before/after failure.
    server gpu-1 127.0.0.1:18201 id 1
    server gpu-2 127.0.0.1:18202 id 2
    server gpu-3 127.0.0.1:18203 id 3
