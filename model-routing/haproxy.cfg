# Demo 1: JSON model -> local model-serving pool. No Enterprise module required.
global
    log stdout format raw local0
    nbthread 1
    tune.bufsize 32768

defaults
    mode http
    log global
    option httplog
    timeout connect 1s
    timeout client 10s
    timeout server 10s
    timeout http-request 5s

frontend inference
    bind 127.0.0.1:18080
    http-request return status 404 unless { path -m str /v1/chat/completions }
    http-request return status 405 unless METH_POST
    http-request return status 415 unless { req.hdr(Content-Type) -m reg -i ^application/json[[:blank:]]*(;.*)?$ }

    # shortcut: bounded Content-Length uploads only; revisit for large/chunked prompts.
    http-request return status 411 if { req.hdr(Transfer-Encoding) -m found }
    http-request return status 411 unless { req.hdr(Content-Length) -m found }
    http-request return status 413 if { req.body_size gt 8192 }
    http-request set-var(txn.body_size) req.body_size
    http-request wait-for-body time 2s
    # wait-for-body also resumes on a full buffer: never inspect a partial body.
    http-request return status 413 unless { req.body_len,sub(txn.body_size) eq 0 }

    http-request set-var(txn.model) req.body,json_query('$.model')
    acl llama var(txn.model) -m str llama-3.1-8b
    acl qwen var(txn.model) -m str qwen2.5-7b
    http-request return status 400 content-type application/json string '{"error":{"message":"Missing or unsupported model"}}' unless llama or qwen
    use_backend llama_pool if llama
    use_backend qwen_pool if qwen

backend llama_pool
    balance roundrobin
    option httpchk GET /health
    server llama-1 127.0.0.1:18101 check inter 500ms fall 2 rise 1

backend qwen_pool
    balance roundrobin
    option httpchk GET /health
    server qwen-1 127.0.0.1:18102 check inter 500ms fall 2 rise 1
